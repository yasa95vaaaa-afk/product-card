
  <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Уровень 1 — Footer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Здесь по заданию должен быть основной контент страницы -->
  <main>
    <button type="button" class="btn-primary" id="openModalBtn">Регистрация</button>
  </main>

  <div class="overlay" id="overlay"></div>

  <div class="modal" id="registerModal">
    <button type="button" class="modal__close" id="closeModalBtn" aria-label="Закрыть">&times;</button>
    <h2 class="modal__title">Регистрация</h2>

    <form class="register-form" id="registerForm" novalidate>

      <label for="firstName">Имя</label>
      <input type="text" id="firstName" name="firstName" placeholder="Введите имя" required>

      <label for="lastName">Фамилия</label>
      <input type="text" id="lastName" name="lastName" placeholder="Введите фамилию" required>

      <label for="birthDate">Дата рождения</label>
      <input type="date" id="birthDate" name="birthDate" required>

      <label for="login">Логин</label>
      <input type="text" id="login" name="login" placeholder="Придумайте логин" minlength="3" required>

      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" placeholder="Придумайте пароль" minlength="6" required>

      <label for="passwordRepeat">Повторите пароль</label>
      <input type="password" id="passwordRepeat" name="passwordRepeat" placeholder="Повторите пароль" minlength="6" required>

      <p class="register-form__error" id="registerError" role="alert"></p>

      <button type="submit" class="btn-primary">Зарегистрироваться</button>
    </form>
  </div>

  <footer class="footer">
    <div class="footer__inner">

      <div class="footercol footerbrand">
        <h2 class="footer__title">Product Cards</h2>
        <p class="footer__text">У Нас Самые Лучшие Продукты Для Кожи!</p>
        <nav class="footer__social" aria-label="Социальные сети">
          <a href="#" class="footer__social-link" aria-label="Telegram">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21.05 2.93 2.75 10.06c-1.25.5-1.24 1.2-.23 1.51l4.7 1.47 1.82 5.6c.22.6.11.85.75.85.5 0 .72-.23.99-.5l2.37-2.3 4.93 3.64c.9.5 1.55.24 1.78-.84l3.22-15.16c.34-1.33-.5-1.93-1.35-1.55Z"/>
            </svg>
          </a>
          <a href="#" class="footer__social-link" aria-label="ВКонтакте">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M13.16 18.5c-6.2 0-9.75-4.26-9.9-11.35h3.13c.1 5.14 2.4 7.32 4.2 7.78v-7.78h2.96v4.48c1.78-.19 3.65-2.21 4.28-4.48h2.96c-.48 2.8-2.5 4.83-3.93 5.66 1.43.68 3.73 2.44 4.59 5.69h-3.25c-.68-2.16-2.4-3.84-4.65-4.06v4.06h-.39Z"/>
            </svg>
          </a>
        </nav>
      </div>

      <div class="footercol footersubscribe">
        <h2 class="footertitle footertitle--center">Подпишись на наши акции:</h2>
        <form class="subscribe-form" id="subscribeForm" novalidate>
          <label for="subscribeEmail" class="visually-hidden">Email</label>
          <input
            type="email"
            id="subscribeEmail"
            name="email"
            class="subscribe-form__input"
            placeholder="Введи Email..."
            required
          >
          <span class="subscribe-form__divider" aria-hidden="true"></span>
          <button type="submit" class="subscribe-form__button">Подписаться</button>
        </form>
        <p class="subscribe-form__error" id="subscribeError" role="alert"></p>
      </div>
<div class="footercol footerlinks">
        <h2 class="footer__title">Быстрые ссылки</h2>
        <nav aria-label="Быстрые ссылки">
          <ul class="footer__list">
            <li><a href="#">Главная</a></li>
            <li><a href="#">Магазин</a></li>
            <li><a href="#">Контакты</a></li>
          </ul>
        </nav>
      </div>

    </div>

    <hr class="footer__divider">

    <p class="footer__copy">www.product-cards.com©all right reserve</p>
  </footer>

<script type="module" src="/homework-11.js"></script>
</body>
</html>
